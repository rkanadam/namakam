<div class="layout-container" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <!-- Left Navigation Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header-row">
      <div class="sidebar-brand">
        <h2 class="sidebar-logo">श्रीरुद्रप्रश्‍नः</h2>
        <p class="sidebar-sublogo">Namakam Study Suite</p>
      </div>
      <button 
        type="button" 
        class="sidebar-toggle-btn" 
        (click)="toggleSidebar()" 
        [title]="isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
        {{ isSidebarCollapsed() ? '❯' : '❮' }}
      </button>
    </div>
    
    <nav class="nav-menu">
      <button 
        class="nav-btn" 
        [class.active]="type === 'introduction'"
        (click)="selectIntro()"
        title="भूमिका (Introduction)">
        <span class="nav-icon">📖</span>
        <span class="nav-text">भूमिका (Introduction)</span>
      </button>

      <div class="nav-section-title">अनुवाकाः & मन्त्राः (Anuvakas & Mantras)</div>
      <div class="anuvaka-list">
        <div *ngFor="let anv of anuvakams" class="anuvaka-sidebar-group">
          <div class="anuvaka-header-row">
            <button 
              class="nav-btn sub-btn anuvaka-main-btn" 
              (click)="selectAnuvakam(anv.anuvakam)"
              [title]="anv.title">
              <span class="anuvaka-num">{{ anv.anuvakam }}</span>
              <span class="anuvaka-title-nav">{{ anv.title }}</span>
            </button>
            <button 
              type="button"
              class="toggle-expand-btn"
              [class.expanded]="isAnuvakamExpanded(anv.anuvakam)"
              (click)="toggleAnuvakamExpand(anv.anuvakam, $event)"
              [title]="isAnuvakamExpanded(anv.anuvakam) ? 'Collapse mantras' : 'Expand mantras'">
              {{ isAnuvakamExpanded(anv.anuvakam) ? '▾' : '▸' }}
            </button>
          </div>

          <!-- Sidebar Mantras List -->
          <div class="sidebar-mantras-container" *ngIf="isAnuvakamExpanded(anv.anuvakam)">
            <button 
              *ngFor="let m of anv.mantras"
              class="sidebar-mantra-btn"
              (click)="selectMantraFromSidebar(anv.anuvakam, m.id)"
              [title]="getMantraPrefix(m.samhita)">
              <span class="s-dot">•</span>
              <span class="s-mantra-label">
                <span class="s-mantra-num">M{{ m.id }}</span>
                <span class="s-mantra-prefix" *ngIf="m.samhita"> — {{ getMantraPrefix(m.samhita) }}</span>
              </span>
            </button>
          </div>
        </div>
      </div>

      <button 
        class="nav-btn" 
        [class.active]="type === 'conclusion'"
        (click)="selectConclusion()">
        <span class="nav-icon">📜</span>
        <span class="nav-text">फलश्रुतिः (Conclusion)</span>
      </button>

      <button 
        class="nav-btn" 
        (click)="selectWordIndex()">
        <span class="nav-icon">🔍</span>
        <span class="nav-text">पदसूची (Word Index)</span>
      </button>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="preface-view">
      <a routerLink="/" class="back-link">← Back to Anuvakas</a>

      <div class="preface-header">
        <h2>{{ title }}</h2>
      </div>

      <div class="section" *ngIf="data">
        <!-- Source tabs -->
        <div class="tabs">
          <button class="tab-btn" [class.active]="activeSource === 'rudradhyaya'"
                  (click)="activeSource = 'rudradhyaya'">Rudradhyāya</button>
          <button class="tab-btn" [class.active]="activeSource === 'rudrabhashya'"
                  (click)="activeSource = 'rudrabhashya'">Rudrabhāṣya</button>
        </div>

        <!-- Language toggle -->
        <div class="lang-toggle">
          <button class="lang-btn" [class.active]="activeLanguage === 'english'"
                  (click)="activeLanguage = 'english'">English</button>
          <button class="lang-btn" [class.active]="activeLanguage === 'sanskrit'"
                  (click)="activeLanguage = 'sanskrit'">Sanskrit</button>
        </div>

        <!-- Content -->
        <div class="preface-content" [class.sanskrit-mode]="activeLanguage === 'sanskrit'">
          <pre class="preface-text">{{ currentText }}</pre>
        </div>
      </div>
    </div>
  </main>
</div>
