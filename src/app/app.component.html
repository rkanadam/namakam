<main class="main">
  <!-- Editor Status Banner (Visible only when env is set) -->
  <div class="editor-status-bar" *ngIf="isEditorEnabled">
    <div class="status-info">
      <span class="status-dot"></span>
      <span class="status-text"><strong>Sanskrit Editor Active</strong> (ENV ENABLE_EDITOR=true)</span>
    </div>
    <div class="status-actions">
      <button type="button" class="bar-btn" (click)="exportEdits()" title="Export all custom edits as JSON">
        📥 Export Corrections
      </button>
      <label class="bar-btn file-label" title="Import custom corrections from JSON file">
        📤 Import Corrections
        <input type="file" accept=".json" (change)="importEdits($event)" style="display: none;">
      </label>
      <button type="button" class="bar-btn btn-danger" (click)="clearAllEdits()" title="Reset all custom edits">
        🧹 Reset All
      </button>
    </div>
  </div>

  <header class="page-header">
    <div class="header-container">
      <a routerLink="/" class="header-link">
        <h1 class="page-title">श्री रुद्रप्रश्नः – नमकप्रश्नः</h1>
        <p class="page-subtitle">Sri Rudra Prashna – Namakam</p>
      </a>

      <!-- Script / Transliteration Toggle (Sanskrit vs English IAST) -->
      <div class="script-toggle-group">
        <button 
          type="button"
          class="script-toggle-btn"
          [class.active]="selectedLanguage === 'sanskrit'"
          (click)="setLanguage('sanskrit')"
          title="Display text in Devanagari script">
          🕉️ संस्कृतम्
        </button>
        <button 
          type="button"
          class="script-toggle-btn"
          [class.active]="selectedLanguage === 'english'"
          (click)="setLanguage('english')"
          title="Display text in English IAST transliteration">
          🇬🇧 English (IAST)
        </button>
      </div>
    </div>
  </header>
  <router-outlet></router-outlet>
</main>
